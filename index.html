<html lang="pt-BR"><head><meta charset="utf-8">

<style>

.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.f{font-size:1.2em}.cc{font-size:.7em;opacity:.7;margin-left:2px}
.wrap{overflow-x:auto}

.mu{color:var(--mu)}

table.t td,table.t th{padding:3px 5px;font-size:.85em;white-space:nowrap}
html:root:root{--bg:#eef1f5;--sf:#fff;--tx:#14181f;--mu:#667085;--bd:#dde2ea;--ac:#e10600;color-scheme:light}
button{font-weight:600}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.bx{background:#fff;color:#14181f;border-radius:12px;box-shadow:0 1px 4px #0002;margin:10px 0;overflow:hidden}.bx>h4{margin:0;background:var(--tc,#14181f);color:var(--tf,#fff);padding:8px 12px;font-size:.9em;letter-spacing:.05em;text-transform:uppercase}.bx>.in{padding:10px 12px}
@keyframes bl{50%{opacity:.35}}.pit{display:inline-block;background:#f5c400;color:#000;border-radius:6px;padding:0 6px;margin-left:4px;font-weight:700;animation:bl .6s infinite}
table.t th{background:var(--tc,#14181f);color:var(--tf,#fff)}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--tc,#14181f) 30%,var(--bg)) 0,var(--bg) 340px) no-repeat var(--bg)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}

.big{background:#0b0d10;color:#fff;border:1px solid #fff;font-weight:800;font-style:italic;padding:24px 12px;border-radius:6px;font-size:1.05em;width:100%}.big:hover{background:var(--ac)}
.chub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:640px;margin:20px auto}

table.lt{border-collapse:collapse;width:100%}table.lt th{position:sticky;top:0;background:#e8ebf0;color:#14181f;font-size:.85em;padding:6px 8px;text-align:center;white-space:nowrap}table.lt td{padding:5px 8px;font-size:.9em;white-space:nowrap;border-bottom:1px solid #eef0f3}
.lst tr{cursor:pointer}.lst tr.sel td{background:#1e6fd9;color:#fff}
.cbt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.ed label{display:block;font-size:.85em}.ed input,.ed select{width:100%}.ed input[type=color]{height:38px;padding:2px;cursor:pointer}
body[data-bg]{background:linear-gradient(rgba(8,10,14,.18),rgba(8,10,14,.45)) center/cover fixed no-repeat,var(--img) center/cover fixed no-repeat #0f1114!important;color:#fff}body[data-bg] .mu,body[data-bg] #ch{color:#d5d9df}body[data-bg] .bx,body[data-bg] .card,body[data-bg] .team{color:var(--tx)}body[data-bg] .bx .mu,body[data-bg] .card .mu{color:var(--mu)}body[data-bg] .team{color:inherit}body[data-bg] h1{color:#fff;text-shadow:0 2px 12px #000a}body[data-bg=menu] .hero h1{color:#fff}
#rc{display:flex;flex-direction:column;max-height:calc(100vh - 112px);position:sticky;top:8px;padding:8px 10px}#rc .rh p{margin:3px 0;font-size:.9em}#rc .rt{overflow:auto;flex:1;min-height:0}#rc .rt table.t th{position:sticky;top:0;z-index:2}#rc .rt table.t td,#rc .rt table.t th{padding:2px 6px;font-size:12px;line-height:1.2;white-space:nowrap}#rc .rt .bar{height:7px!important}@media (max-height:720px){#rc{position:sticky;top:4px}#rc .rt{font-size:11px}#rc .rt td,#rc .rt th{padding:0 4px!important;line-height:14px}#rc .rt svg{width:11px;height:11px}#rc .rt .f{font-size:10px}.rbar{height:5px!important}}#rc .rt svg{width:14px;height:14px}#rc .rt td{padding-top:1px!important;padding-bottom:1px!important}#rc .rt .f{font-size:12px}#rc .rt .cc{display:none}#rc{max-height:calc(100vh - 24px)!important}#rc>.mu{font-size:.8em;margin-top:4px;max-height:3.6em;overflow:hidden}
html,body{height:100%;overflow:hidden}main#app{height:100vh;box-sizing:border-box;overflow:auto}#zw{--z:1}
.fv{height:calc((100vh - 32px)/var(--z,1));display:flex;flex-direction:column;gap:8px}.fv .fr{flex:1;min-height:0;display:flex;gap:12px;align-items:stretch}.fv .fl{width:230px;flex:none;margin:0;overflow:auto}.fv #rc{flex:1;min-width:0;margin:0;position:static!important;max-height:none!important;overflow:hidden}.fv #rc .rt{flex:1;min-height:0}.fv #rc>.mu{flex:none}.fv .fl .in p{margin:6px 0}
@media (max-height:720px){#rc .rh{display:block!important}}
.pm{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:120;padding:10px}.pbox{background:var(--tc);color:var(--tf);border-radius:8px;padding:16px 18px;width:min(640px,96vw);max-height:94vh;overflow:auto;box-shadow:0 10px 40px #000a}.pbox h2{text-align:center;text-decoration:underline;margin:4px 0 14px}.pbox .pb{display:block;width:100%;background:#000;color:var(--tc);border:0;border-radius:4px;padding:14px;font-weight:700;font-size:1.05em;margin-top:10px;cursor:pointer}.pr{display:flex;justify-content:center;gap:10px;margin:7px 0}.pr u{min-width:90px;text-align:right}.nt{width:100%;border-collapse:collapse;background:#fff;color:#000;font-size:.9em}.nt th{padding:4px 6px;border-bottom:1px solid #ddd}.nt td{padding:4px 6px;cursor:pointer;text-align:center}.nt td:last-child{text-align:left}.nt tr.sel td{background:#0a78d7;color:#fff}.nw{background:#fff;border:2px solid #000;max-height:170px;overflow:auto}.nd{background:#fff;color:#000;border-radius:0 0 4px 4px;padding:10px;min-height:70px;max-height:30vh;overflow:auto;white-space:pre-wrap}.nh{background:#000;color:var(--tc);text-align:center;font-weight:700;padding:5px;margin-top:10px;border-radius:4px 4px 0 0}#fb{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;z-index:60}#fb button{width:auto!important;margin:0!important;padding:10px 16px;box-shadow:0 4px 14px #0006}
</style></head><body><main id="app"></main>
<script>
const FL=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt()));

T("Cadillac","US","#1c1c1e","#fff","fer",[["Sergio Pérez","MX",7.3],["Valtteri Bottas","FI",7.2]])],
2025:[
T("McLaren","GB","#ff8000","#1a0d00","mer",[["Lando Norris","GB",9.2],["Oscar Piastri","AU",9.0]]),
T("Ferrari","IT","#dc0000","#fff","fer",[["Charles Leclerc","MC",9.2],["Lewis Hamilton","GB",8.9]]),
T("Red Bull","AT","#1e41ff","#fff","hon",[["Max Verstappen","NL",9.8],["Yuki Tsunoda","JP",7.6]]),
T("Mercedes","GB","#00d2be","#06201d","mer",[["George Russell","GB",8.9],["Kimi Antonelli","IT",7.9]]),
T("Williams","GB","#005aff","#fff","mer",[["Alex Albon","TH",8.0],["Carlos Sainz","ES",8.3]]),
T("Aston Martin","GB","#006f62","#fff","mer",[["Fernando Alonso","ES",8.6],["Lance Stroll","CA",6.9]]),

T("Haas","US","#b6babd","#111","fer",[["Esteban Ocon","FR",7.5],["Oliver Bearman","GB",7.5]]),
T("Alpine","FR","#0093cc","#fff","ren",[["Pierre Gasly","FR",7.8],["Franco Colapinto","AR",7.1]]),
T("Sauber","CH","#52e252","#062006","fer",[["Nico Hülkenberg","DE",7.7],["Gabriel Bortoleto","BR",7.3]])]};

const LV={gar:["Garagista","Pouco dinheiro, mas com grandes ambições.",5e6],med:["Média","Instalações e preparo inicial, aporte baixo a médio, torcida pequena.",8e6],gra:["Marca conhecida","Já correu na F1 ou em outras categorias. Aporte médio a alto, sem brigar por títulos de cara. Pode ser fabricante de motores.",12e6],ric:["Equipe rica","O dinheiro compra moral. Aporte alto, nunca acima das 3 mais ricas da temporada. Pode ser fabricante de motores.",15e6]};
const CTRY={AR:"Argentina",AU:"Austrália",AT:"Áustria",BE:"Bélgica",BR:"Brasil",CA:"Canadá",CL:"Chile",CN:"China",CO:"Colômbia",DK:"Dinamarca",FI:"Finlândia",FR:"França",DE:"Alemanha",GB:"Reino Unido",HU:"Hungria",IN:"Índia",ID:"Indonésia",IT:"Itália",JP:"Japão",MX:"México",MC:"Mônaco",NL:"Países Baixos",NZ:"Nova Zelândia",NO:"Noruega",PL:"Polônia",PT:"Portugal",QA:"Catar",SA:"Arábia Saudita",SG:"Singapura",ZA:"África do Sul",KR:"Coreia do Sul",ES:"Espanha",SE:"Suécia",CH:"Suíça",TH:"Tailândia",AE:"Emirados Árabes",US:"Estados Unidos",UY:"Uruguai",VE:"Venezuela"};
const SAVE="pwm_save_v1";
let S={screen:"menu",season:null,pick:null,boss:"",nt:{lv:"gar",mot:false,pw:70,name:"",cc:"BR",c1:"#d6001c",c2:"#ffffff",rep:0},g:null,tab:"resumo"};
const $=s=>document.querySelector(s),app=$("#app");
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S.g))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE))}catch(e){return null}}
function go(s){S.screen=s;draw()}
function tcard(t,i,sel){return `<div class="team ${sel?"sel":""}" style="background:${t.bg};color:${t.fg}" onclick="S.pick=${i};draw()">
<div class="row"><b>${t.n}</b><span>${flag(t.c)}</span></div>
${t.d.map(d=>`<div class="row"><span>${flag(d.c)} ${d.n}</span><b>${d.r.toFixed(1).replace(".",",")}</b></div>`).join("")}
<small>Motor: ${(ENG[t.e]||['—',''])[0]}${t.w?' (fabricante)':''} ${ENG[t.e]?flag(ENG[t.e][1]):''}</small></div>`}
function draw(){
const f={menu:vMenu,season:vSeason,team:vTeam,newteam:vNew,manage:vDash,cust:vCust,wk:vWk,car:vCar,mkt:vMkt,cal:vCal,mot:vMot,drv:vDrv,hof:vHof,ret:vRet,pil:vPil}[S.screen];app.innerHTML=f();document.documentElement.style.setProperty('--tc',S.g?S.g.team.bg:'#14181f');document.documentElement.style.setProperty('--tf',S.g?S.g.team.fg:'#fff')}
function vMenu(){const has=!!load();return `<div class="hero"><h1>Pit Wall Manager</h1>
<svg class="car" viewBox="0 0 520 140" role="img" aria-label="Silhueta de carro de F1"><g fill="currentColor"><rect x="20" y="96" width="480" height="8" rx="4"/><path d="M60 92 L150 70 L300 64 L430 74 L490 70 L490 92Z"/><circle cx="130" cy="98" r="26"/><circle cx="400" cy="98" r="28"/><rect x="440" y="38" width="62" height="10" rx="3"/><rect x="14" y="60" width="40" height="8" rx="3"/></g><circle cx="130" cy="98" r="10" fill="var(--bg)"/><circle cx="400" cy="98" r="11" fill="var(--bg)"/></svg>
<div class="menu"><button class="p" onclick="go('season')">Novo jogo</button>
<button ${has?"":"disabled"} onclick="S.g=load();if(S.g.car){S.g.grid[S.g.ti]=S.g.team;if(S.g.cal)CAL.splice(0,CAL.length,...S.g.cal);S.screen='manage';draw()}else alert('Save antigo: inicie um novo jogo.')">Carregar jogo</button>
<button onclick="S.cs='hub';go('cust')">Customizar</button></div></div>`}
function vSeason(){return `<h2>Escolha a temporada</h2><p class="mu">Cada temporada define o número de equipes no grid.</p>

<p><button onclick="go('menu')">Voltar</button></p>`}
function vTeam(){const ts=SEASONS[S.season];const t=ts[S.pick];
return `<h2>Temporada ${S.season}: escolha sua equipe</h2>
<div class="grid">${ts.map((x,i)=>tcard(x,i,S.pick===i)).join("")}</div>
<div class="card"><label>Nome do chefe de equipe<br><input id="boss" maxlength="30" value="${S.boss}" oninput="S.boss=this.value.replace(/[^A-Za-zÀ-ÿ ]/g,'');"></label></div>
<p><button onclick="go('season')">Voltar</button>
<button class="p" ${S.pick===null?"disabled":""} onclick="start(false)">Assumir ${t?t.n:"equipe"}</button>
<button ${S.pick===null?"disabled":""} onclick="go('newteam')">Criar equipe nova no lugar de ${t?t.n:"..."}</button></p>
${S.pick===null?'<p class="mu">Selecione uma equipe: ela será assumida ou substituída pela sua.</p>':""}`}
function vNew(){const n=S.nt,t=SEASONS[S.season][S.pick],big=n.lv=="gra"||n.lv=="ric";
return `<h2>Nova equipe no lugar da ${t.n}</h2>

function start(isNew){
const ts=SEASONS[S.season],i=S.pick,o=ts[i],n=S.nt,boss=(S.boss||"").trim();if(!boss){alert("Digite o nome do chefe de equipe.");return}
let team;
if(isNew){if(!n.name.trim()){alert("Digite o nome da equipe.");return}
const eng=n.mot?[n.name.trim(),n.cc,n.lv=="gra"?n.pw:70]:null;
team={n:n.name.trim(),c:n.cc,bg:n.c1,fg:n.c2,eng:eng?eng[0]:"Cliente (a definir)",engc:eng?eng[1]:null,mot:!!eng,pw:eng?eng[2]:null,d:o.d.map(cl),cash:LV[n.lv][2]*2,s:{gar:4,med:5,gra:6,ric:7.5}[n.lv],lv:LV[n.lv][0]};
}else team={n:o.n,c:o.c,bg:o.bg,fg:o.fg,eng:ENG[o.e][0],engc:ENG[o.e][1],mot:false,pw:null,d:o.d.map(cl),cash:CASH[Math.min(i,CASH.length-1)],s:o.s,lv:"Equipe existente"};
