<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Wall Manager</title>
<style>
:root{--bg:#f4f4f2;--sf:#fff;--tx:#15171a;--mu:#666;--bd:#d8d8d4;--ac:#d6001c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1114;--sf:#1a1d21;--tx:#eee;--mu:#9aa0a6;--bd:#2e3238;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1114;--sf:#1a1d21;--tx:#eee;--mu:#9aa0a6;--bd:#2e3238;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Arial,sans-serif;line-height:1.4}
main{max-width:980px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.4em 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 16px;border-radius:8px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);max-width:100%}
.hero{text-align:center;padding:40px 10px}
.car{width:min(520px,100%);margin:10px auto}
.menu{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:20px auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.team{border-radius:10px;padding:12px;cursor:pointer;border:3px solid transparent}
.team.sel{border-color:var(--tx)}
.team small{opacity:.85}
.row{display:flex;justify-content:space-between;gap:8px;margin:3px 0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lv label{display:block;border:2px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;background:var(--sf)}
.lv input{display:none}.lv input:checked+div{color:var(--ac);font-weight:600}
.lv label:has(input:checked){border-color:var(--ac)}
.f{font-size:1.2em}.cc{font-size:.7em;opacity:.7;margin-left:2px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
.mu{color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
nav button.on{background:var(--tx);color:var(--bg)}
table.t td,table.t th{padding:3px 5px;font-size:.85em;white-space:nowrap}
html:root:root{--bg:#eef1f5;--sf:#fff;--tx:#14181f;--mu:#667085;--bd:#dde2ea;--ac:#e10600;color-scheme:light}
button{font-weight:600}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.bx{background:#fff;color:#14181f;border-radius:12px;box-shadow:0 1px 4px #0002;margin:10px 0;overflow:hidden}.bx>h4{margin:0;background:var(--tc,#14181f);color:var(--tf,#fff);padding:8px 12px;font-size:.9em;letter-spacing:.05em;text-transform:uppercase}.bx>.in{padding:10px 12px}
@keyframes bl{50%{opacity:.35}}.pit{display:inline-block;background:#f5c400;color:#000;border-radius:6px;padding:0 6px;margin-left:4px;font-weight:700;animation:bl .6s infinite}
table.t th{background:var(--tc,#14181f);color:var(--tf,#fff)}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--tc,#14181f) 30%,var(--bg)) 0,var(--bg) 340px) no-repeat var(--bg)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.mb{display:flex;flex-wrap:wrap;gap:2px;background:#14181f;padding:4px;border-radius:10px;border-bottom:4px solid var(--tc,#14181f)}.mb button{background:transparent;color:#fff;border:0;padding:7px 11px}
</style></head><body><main id="app"></main>

2025:[
T("McLaren","GB","#ff8000","#1a0d00","mer",[["Lando Norris","GB",9.2],["Oscar Piastri","AU",9.0]]),

T("Alpine","FR","#0093cc","#fff","ren",[["Pierre Gasly","FR",7.8],["Franco Colapinto","AR",7.1]]),

let S={screen:"menu",season:null,pick:null,boss:"",nt:{lv:"gar",mot:false,pw:70,name:"",cc:"BR",c1:"#d6001c",c2:"#ffffff",rep:0},g:null,tab:"resumo"};
const $=s=>document.querySelector(s),app=$("#app");
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S.g))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE))}catch(e){return null}}
function go(s){S.screen=s;draw()}
function tcard(t,i,sel){return `<div class="team ${sel?"sel":""}" style="background:${t.bg};color:${t.fg}" onclick="S.pick=${i};draw()">
<div class="row"><b>${t.n}</b><span>${flag(t.c)}</span></div>
${t.d.map(d=>`<div class="row"><span>${flag(d.c)} ${d.n}</span><b>${d.r.toFixed(1).replace(".",",")}</b></div>`).join("")}

function draw(){
const f={menu:vMenu,season:vSeason,team:vTeam,newteam:vNew,manage:vDash,cust:vCust,wk:vWk,car:vCar,mkt:vMkt,cal:vCal,mot:vMot,drv:vDrv,hof:vHof,ret:vRet,pil:vPil}[S.screen];app.innerHTML=f();document.documentElement.style.setProperty('--tc',S.g?S.g.team.bg:'#14181f');document.documentElement.style.setProperty('--tf',S.g?S.g.team.fg:'#fff')}
function vMenu(){const has=!!load();return `<div class="hero"><h1>Pit Wall Manager</h1>
<svg class="car" viewBox="0 0 520 140" role="img" aria-label="Silhueta de carro de F1"><g fill="currentColor"><rect x="20" y="96" width="480" height="8" rx="4"/><path d="M60 92 L150 70 L300 64 L430 74 L490 70 L490 92Z"/><circle cx="130" cy="98" r="26"/><circle cx="400" cy="98" r="28"/><rect x="440" y="38" width="62" height="10" rx="3"/><rect x="14" y="60" width="40" height="8" rx="3"/></g><circle cx="130" cy="98" r="10" fill="var(--bg)"/><circle cx="400" cy="98" r="11" fill="var(--bg)"/></svg>
<div class="menu"><button class="p" onclick="go('season')">Novo jogo</button>
<button ${has?"":"disabled"} onclick="S.g=load();if(S.g.car){S.g.grid[S.g.ti]=S.g.team;S.screen='manage';draw()}else alert('Save antigo: inicie um novo jogo.')">Carregar jogo</button>
<button onclick="go('cust')">Customizar</button></div></div>`}
function vSeason(){return `<h2>Escolha a temporada</h2><p class="mu">Cada temporada define o número de equipes no grid.</p>
<div class="grid">${Object.keys(SEASONS).sort((a,b)=>b-a).map(y=>`<button style="padding:24px" onclick="S.season=${y};S.pick=null;go('team')"><b style="font-size:1.6em">${y}</b><br>${SEASONS[y].length} equipes</button>`).join("")}</div>
<p><button onclick="go('menu')">Voltar</button></p>`}
function vTeam(){const ts=SEASONS[S.season];const t=ts[S.pick];
return `<h2>Temporada ${S.season}: escolha sua equipe</h2>
<div class="grid">${ts.map((x,i)=>tcard(x,i,S.pick===i)).join("")}</div>
<div class="card"><label>Nome do chefe de equipe<br><input id="boss" maxlength="30" value="${S.boss}" oninput="S.boss=this.value.replace(/[^A-Za-zÀ-ÿ ]/g,'');"></label></div>
<p><button onclick="go('season')">Voltar</button>
<button class="p" ${S.pick===null?"disabled":""} onclick="start(false)">Assumir ${t?t.n:"equipe"}</button>
<button ${S.pick===null?"disabled":""} onclick="go('newteam')">Criar equipe nova no lugar de ${t?t.n:"..."}</button></p>
${S.pick===null?'<p class="mu">Selecione uma equipe: ela será assumida ou substituída pela sua.</p>':""}`}
function vNew(){const n=S.nt,t=SEASONS[S.season][S.pick],big=n.lv=="gra"||n.lv=="ric";
return `<h2>Nova equipe no lugar da ${t.n}</h2>

${big?`<div class="card"><label><input type="checkbox" ${n.mot?"checked":""} onchange="S.nt.mot=this.checked;draw()"> Ser fabricante de motores (o motor terá o nome da equipe)</label>
${n.mot&&n.lv=="gra"?`<div style="margin-top:8px">Potência inicial: <b>${n.pw}%</b><br><input type="range" min="65" max="80" value="${n.pw}" oninput="S.nt.pw=+this.value;this.previousElementSibling.previousElementSibling.textContent=this.value+'%'"></div>`:""}</div>`:""}
<div class="card"><label>Nome da equipe (até 30 caracteres, letras e números)<br><input id="tn" maxlength="30" value="${n.name}" oninput="S.nt.name=this.value.replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'');if(this.value!==S.nt.name)this.value=S.nt.name"></label>
<p><label>País<br><select onchange="S.nt.cc=this.value">${Object.entries(CTRY).sort((a,b)=>a[1].localeCompare(b[1])).map(([c,nm])=>`<option value="${c}" ${n.cc==c?"selected":""}>${FL(c)} ${nm}</option>`).join("")}</select></label></p>
<p>Cores: <input type="color" value="${n.c1}" onchange="S.nt.c1=this.value;draw()"> <input type="color" value="${n.c2}" onchange="S.nt.c2=this.value;draw()">

function start(isNew){
const ts=SEASONS[S.season],i=S.pick,o=ts[i],n=S.nt,boss=(S.boss||"").trim();if(!boss){alert("Digite o nome do chefe de equipe.");return}

team={n:n.name.trim(),c:n.cc,bg:n.c1,fg:n.c2,eng:eng?eng[0]:"Cliente (a definir)",engc:eng?eng[1]:null,mot:!!eng,pw:eng?eng[2]:null,d:o.d.map(cl),cash:LV[n.lv][2]*2,s:{gar:4,med:5,gra:6,ric:7.5}[n.lv],lv:LV[n.lv][0]};
}else team={n:o.n,c:o.c,bg:o.bg,fg:o.fg,eng:ENG[o.e][0],engc:ENG[o.e][1],mot:false,pw:null,d:o.d.map(cl),cash:CASH[i],s:o.s,lv:"Equipe existente"};
const goals=i<4?["Vencer o campeonato de construtores","Marcar 3 poles"]:i<8?["Terminar no top 5 dos construtores","Conquistar um pódio"]:["Terminar fora das 3 últimas posições","Marcar pontos em 5 corridas"];
S.g={season:S.season,boss,team,goal:goals[Math.floor(Math.random()*goals.length)],round:1,spon:[],gastos:0,pts:{},cpts:{},ti:i,grid:ts.map((x,k)=>k==i?team:{...x,d:x.d.map(cl),car:Object.fromEntries(CARK.map(([q])=>[q,(x.cr&&x.cr[q])||clamp(x.s+rnd(-.3,.3),3,10)]))}),car:Object.fromEntries(CARK.map(([k])=>[k,(o.cr&&o.cr[k])||clamp(team.s+rnd(-.3,.3),3,10)])),inv:Object.fromEntries(CARK.map(([k])=>[k,3e4])),lim:25e4,pool:FA.map(x=>({...x})),news:[],hist:[],rev:0,sp:[],off:[],rec:{t:0,p:0,w:0,dt:0},old:[],eng:engInit(team),mc:isNew?(team.mot?{k:'own',yrs:99,mfg:true}:{k:o.e,yrs:1}):{k:o.e,yrs:1,mfg:MF[S.season][i]==o.e}};
initG(S.g,o);save();S.tab="resumo";S.screen="manage";draw()}
function vManage(){const g=S.g,t=g.team;
const tabs={resumo:"Resumo",gp:"Corrida",camp:"Campeonato",pilotos:"Pilotos",fin:"Finanças",carro:"Carro e motor"};
let body=S.tab=="gp"?vGp():S.tab=="camp"?vCamp():"";
if(S.tab=="resumo")body=`<div class="card" style="background:${t.bg};color:${t.fg}"><h3>${t.n} ${flag(t.c)}</h3>

const CAL='Austrália|Albert Park|AU|58|0;China|Xangai|CN|56|0;Japão|Suzuka|JP|53|0;Bahrein|Sakhir|BH|57|1;Arábia Saudita|Jidá|SA|50|1;Miami|Miami|US|57|0;Canadá|Gilles Villeneuve|CA|70|0;Mônaco|Monte Carlo|MC|78|0;Espanha|Barcelona|ES|66|0;Áustria|Red Bull Ring|AT|71|0;Grã-Bretanha|Silverstone|GB|52|0;Bélgica|Spa|BE|44|0;Hungria|Hungaroring|HU|70|0;Países Baixos|Zandvoort|NL|72|0;Itália|Monza|IT|53|0;Madri|Madring|ES|57|0;Azerbaijão|Baku|AZ|51|0;Singapura|Marina Bay|SG|62|0;EUA|Austin|US|56|0;México|Hermanos Rodríguez|MX|71|0;Brasil|Interlagos|BR|71|0;Las Vegas|Las Vegas|US|50|0;Catar|Lusail|QA|57|1;Abu Dhabi|Yas Marina|AE|58|1'.split(';').map(x=>{const a=x.split('|');return{gp:a[0],c:a[1],cc:a[2],l:+a[3],dry:+a[4]}});

const lf=(c,t)=>TY[c.cp][2];
const ord=R=>R.cars.slice().sort((a,b)=>a.dnf-b.dnf||(a.dnf?b.dl-a.dl:a.tot-b.tot));
const perf=(t,d,x)=>d.r*.6+t.s*.4+(x||0);

{const n=R.sched[R.lap];if(n!=null&&n!=R.wx){R.wx=n;R.msg.unshift(`Volta ${R.lap}: clima mudou para ${WX[n]}`)}}

const over=c.age-L,allow=c.ex>=8?5:c.ex>5?3:1;

const cd={S:-.6,M:0,H:c.age>L*.3?-.1:.5,I:0,W:0}[c.cp];

if(d.r>g.team.s+3)return alert(d.n+' recusou: prefere uma equipe mais forte.');
if(sal<dem)return alert(d.n+' recusou: quer pelo menos '+D(dem)+' por temporada.');
const nd={...d,sal,yrs};let old;if(role=='t'){old=g.team.t;g.team.t=nd}else{old=g.team.d[+role];g.team.d[+role]=nd}
g.pool.splice(i,1);if(old)g.pool.push(old);g.news.unshift(d.n+' assinou por '+yrs+' ano(s).');toast(d.n+' aceitou a proposta!',1);save();draw()}

function poach(k,j){const g=S.g,d=g.grid[k].d[j],$=x=>document.getElementById(x+k+'_'+j).value;

g.old.push({y:g.season,p:pos+1});if(dp&&g.hf&&g.hf[dp[0]])g.hf[dp[0]].t++;g.team.cash+=pz;g.rev+=pz;

function engDev(g){if(!g.mc||!g.mc.mfg)return 0;const e=g.eng[g.mc.k];e.el=e.el||e.pw;g.ei=g.ei||{pu:me(e.pw),el:me(e.el)};g.ep2=g.ep2||{...g.ei};let c=0;[['pu','pw'],['el','el']].forEach(([i,p])=>{const v=g.ei[i],m=me(e[p]);let d=clamp((v-m)/m*.12+(v-g.ep2[i])/m*.10,-.3,.3);g.ep2[i]=v;c+=v;e[p]=clamp(e[p]+d,3,10)});return c}
function engUI(g){if(!g.mc||!g.mc.mfg)return '';const e=g.eng[g.mc.k];e.el=e.el||e.pw;g.ei=g.ei||{pu:me(e.pw),el:me(e.el)};g.ep2=g.ep2||{...g.ei};
return `<div class='bx'><h4>Desenvolvimento do motor ${e.n}</h4><div class='in'>${[['pu','Unidade de potência',e.pw],['el','Sistema elétrico',e.el]].map(([k,n,v])=>`<div class='row' style='align-items:center'><span>${n}</span><b>${nf(v)}</b><span class='mu'>manter ${me(v)/1000} mil</span><span>$ <input type='number' min='50' max='450' step='10' value='${g.ei[k]/1000}' style='width:72px' onchange="S.g.ei['${k}']=clamp(+this.value*1000,50000,450000);draw()"> mil</span></div>`).join('')}<p class='mu'>Acima do valor de manutenção o motor melhora; abaixo, piora. Até 3 clientes pagam pelo motor a cada temporada.</p></div></div>`}
function setS(t,v){v=clamp(v,3,10);const d=v-t.s;if(t.cr)for(const k in t.cr)t.cr[k]=clamp(t.cr[k]+d,3,10);t.s=v}

function mkSched(l,b,dry){const s=Array(l+2).fill(0);if(dry)return s;if(b>0){const e=Math.floor(rnd(.3*l,.8*l));for(let i=0;i<l+2;i++)s[i]=i<e?b:(b==2&&i<e+6?1:0)}else if(Math.random()<.4){const a=Math.floor(rnd(5,l-12)),d=Math.floor(rnd(6,20)),w=Math.random()<.5?1:2;for(let i=a;i<Math.min(l+2,a+d);i++)s[i]=w}return s}

function aiOffers(g){[...g.team.d,g.team.t].forEach(d=>{if(d&&d.yrs<=1&&!d.nx&&!d.off&&g.round>=4&&Math.random()<.2){const k=Math.floor(rnd(0,g.grid.length));if(k==g.ti)return;d.off=g.grid[k].n;g.news.unshift('⚠️ '+g.grid[k].n+' quer '+d.n+' (último ano de contrato). Renove para mantê-lo.');toast('⚠️ '+g.grid[k].n+' fez pré-contrato com '+d.n+'! Renove para mantê-lo.',0)}})}
function setupHtml(g,w){const r=w.r;return `<div style='text-align:center'><h3><u>GP ${r.gp} - ${r.l} voltas</u> ${flag(r.cc)}</h3></div><div class='cols'>${g.team.d.map((d,i)=>`<div class='bx'><h4>${flag(d.c)} ${d.n}</h4><div class='in'><p>Pneus: ${tyPick(w.rt[i],`S.g.wk.rt[${i}]='#';draw()`)}<br><b>${TY[w.rt[i]][0]} (${TY[w.rt[i]][2]} voltas)</b></p><p>Grid: <b>${w.q.findIndex(x=>x.ti==g.ti&&x.j==i)+1}º lugar</b></p><label><input type='checkbox' ${w.pa[i]?'checked':''} onchange='S.g.wk.pa[${i}]=this.checked'> Pit automático (aviso de pit stop)</label></div></div>`).join('')}</div><button class='p' style='width:100%;padding:16px' onclick="startRace()">Confirmar</button>`}
function pitAlert(c){const w=S.g.wk,R=w.race;w.paused=true;const pb=document.getElementById('pb');if(pb)pb.textContent='Continuar';const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:99';
d.innerHTML=`<div class='bx' style='width:320px;max-width:92vw'><h4 style='text-align:center'>Pit stop!</h4><div class='in'><div class='row'><span><u>Piloto:</u></span><b>${flag(c.cc)} ${c.n}</b></div><div class='row'><span><u>Novos pneus:</u></span><select id='pt'>${Object.keys(TY).map(k=>`<option value='${k}' ${k==nextTy(R.wx,c)?'selected':''}>${TY[k][0]} (${TY[k][2]} voltas)</option>`).join('')}</select></div><div class='row'><span><u>Volta atual:</u></span><b>${R.lap} / ${R.l}</b></div><p class='mu'>Pneu atual: ${TY[c.cp][0]} · vida restante ${Math.max(0,lf(c)-c.age)} voltas</p><button id='pn' style='width:100%;padding:14px;margin:4px 0'>Cancelar ordem ✖</button><button class='p' id='py' style='width:100%;padding:14px'>Confirmar ✔</button></div></div>`;
document.body.appendChild(d);const done=p=>{if(p){c.pit=d.querySelector('#pt').value;toast('🔧 Pit confirmado: '+c.n+' entra na próxima volta',1)}w.paused=false;if(pb)pb.textContent='Pausar';d.remove()};d.querySelector('#py').onclick=()=>done(1);d.querySelector('#pn').onclick=()=>done(0)}
function vPil(){const g=S.g,n=S.pil;let d,t=null,st='Sem contrato';g.grid.forEach((x,k)=>x.d.forEach((y,j)=>{if(y.n==n){d=y;t=x;st=k==g.ti?(j+1)+'º piloto':'Titular'}}));if(g.team.t&&g.team.t.n==n){d=g.team.t;t=g.team;st='Testes'}if(!d)d=g.pool.find(y=>y.n==n);
if(!d)return `<button onclick="S.tab='dash';go('manage')">Voltar</button>`;
const h=(g.hf||{})[n]||{},B=(a,b)=>`<div class='row'><span><u>${a}:</u></span><b>${b}</b></div>`,mine=t&&g.grid.indexOf(t)==g.ti,NM={la:'Largada',co:'Concentração',ul:'Ultrapassagem',ex:'Experiência',ra:'Rapidez',ch:'Chuva',ac:'Acerto do carro',cl:'Classificação',fi:'Físico'};
return `<div class='bx'><h4 style='font-size:1.2em'>${flag(d.c)} <i>${d.n}</i><span style='float:right'>${t?t.n:'Sem equipe'}</span></h4><div class='in'><div class='cols'><div><div class='bx'><h4>Dados pessoais</h4><div class='in'>${B('Nome',d.n)}${B('País',flag(d.c))}${B('Idade',(d.a||d.age||'-')+' anos')}${B('Potencial',nf(d.pot||d.r))}${B('Auge / Aposent.',d.au+' / '+d.ap)}</div></div><div class='bx'><h4>Carreira (no jogo)</h4><div class='in'>${B('Títulos',h.t||0)}${B('GPs',h.gp||0)}${B('Vitórias',h.w||0)}${B('Poles',h.p||0)}${B('Pódios',h.pd||0)}</div></div></div><div class='bx'><h4>Qualidades</h4><div class='in'>${ATK.map(([k])=>B(NM[k],nf(at(d,k)))).join('')}<p class='mu'>Nota geral: ${nf(d.r)}</p></div></div><div><div class='bx'><h4>Contrato</h4><div class='in'>${B('Equipe',t?t.n:'-')}${B('Salário',d.sal?D(d.sal):'-')}${B('Duração',d.yrs?d.yrs+' ano(s)':'-')}${B('Função',st)}</div></div><div class='bx'><h4>Próximo contrato</h4><div class='in'>${B('Equipe',d.nx?t.n:d.off?'Proposta de '+d.off:'-')}${B('Salário',d.nx?D(d.nx.sal):'-')}${B('Duração',d.nx?d.nx.yrs+' ano(s)':'-')}</div></div>${mine?`<button class='p' style='width:100%' onclick="go('mkt')">Renovar contrato</button>`:''}</div></div></div></div><button onclick="go('drv')">Voltar</button>`}
function offer(d,role,cb,lock){const RS=['0','1','t'],RN={'0':'1º piloto','1':'2º piloto','t':'Piloto de testes'};
const o={sal:clamp(Math.round(d.r*12)*10,10,200),yrs:1,ri:Math.max(0,RS.indexOf(String(role)))},el=document.createElement('div');
el.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:99';
const row=(l,v,k,fixed)=>`<div class='row' style='align-items:center'><b>${l}</b><span>${v}</span><span>${fixed?'':`<button data-k='${k}' data-v='1'>▲</button><button data-k='${k}' data-v='-1'>▼</button>`}</span></div>`;
const paint=()=>{el.innerHTML=`<div class='bx' style='width:350px;max-width:92vw'><h4 style='text-align:center;font-size:1.15em'>Oferta de contrato: ${d.n}</h4><div class='in'>${row('Salário','$ '+o.sal+' mil/temporada','s')}${row('Duração',o.yrs+' ano(s)','y')}${row('Situação',RN[RS[o.ri]],'r',lock)}<button id='ov' style='width:100%;padding:12px;margin:8px 0 6px'>Voltar</button><button class='p' id='op' style='width:100%;padding:12px'>Fazer proposta</button></div></div>`;
el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=+b.dataset.v;if(k=='s')o.sal=clamp(o.sal+v*10,10,200);if(k=='y')o.yrs=clamp(o.yrs+v,1,5);if(k=='r')o.ri=(o.ri+v+3)%3;paint()});
el.querySelector('#ov').onclick=()=>el.remove();el.querySelector('#op').onclick=()=>{el.remove();cb({sal:o.sal*1000,yrs:o.yrs,role:RS[o.ri]})}};
paint();document.body.appendChild(el)}
function best2(g){const p=[...g.pool].sort((a,b)=>b.r-a.r)[0];if(!p)return null;g.pool.splice(g.pool.indexOf(p),1);return cl(p)}
function repl(g,x){if(x.t){const q=x.t;x.t=null;q.yrs=1;return q}return best2(g)}
function promote(s){const g=S.g,t=g.team;if(!t.t)return alert('Sem piloto reserva para promover.');const o=t.d[s];t.d[s]=t.t;t.t=o;g.news.unshift(t.d[s].n+' foi promovido a '+(s+1)+'º piloto.');toast(t.d[s].n+' promovido a '+(s+1)+'º piloto! '+o.n+' vai para a reserva.',1);save();draw()}
function renew(i){const g=S.g,t=g.team,d=i==2?t.t:t.d[i];if(!d)return;
offer(d,i==2?'t':String(i),a=>{const dem=clamp(Math.round(d.r*12)*10,10,200)*1000;
if(d.r>t.s+3)return alert(d.n+' recusou renovar: prefere uma equipe mais forte.');
if(a.sal<dem)return alert(d.n+' recusou renovar: quer pelo menos '+D(dem)+' por temporada.');
d.nx={sal:a.sal,yrs:a.yrs};delete d.off;g.news.unshift(d.n+' renovou por '+a.yrs+' ano(s).');toast(d.n+' aceitou renovar por '+a.yrs+' ano(s)!',1);save();draw()},1)}
function propose(i){const g=S.g,d=g.pool[i];if(!d)return;
offer(d,'0',a=>{const dem=clamp(Math.round(d.r*12)*10,10,200)*1000,t=g.team;
if(d.r>t.s+3)return alert(d.n+' recusou: prefere uma equipe mais forte.');
if(a.sal<dem)return alert(d.n+' recusou: quer pelo menos '+D(dem)+' por temporada.');
const nd={...d,sal:a.sal,yrs:a.yrs};let old;if(a.role=='t'){old=t.t;t.t=nd}else{old=t.d[+a.role];t.d[+a.role]=nd}
g.pool.splice(g.pool.indexOf(d),1);if(old)g.pool.push(old);g.news.unshift(d.n+' assinou por '+a.yrs+' ano(s).');toast(d.n+' aceitou a proposta!',1);save();draw()})}
function poach(k,j){const g=S.g,x=g.grid[k],d=j=='t'?x.t:x.d[j];if(!d)return;
offer(d,'0',a=>{const dem=Math.min(2e5,clamp(Math.round(d.r*12)*10,10,200)*1000*1.3);
if((g.pend||[]).some(p=>p.d.n==d.n))return alert(d.n+' recusou: já tem pré-contrato com você.');
if(d.r>g.team.s+3)return alert(d.n+' recusou: prefere uma equipe mais forte.');
if(a.sal<dem)return alert(d.n+' quer pelo menos '+D(dem)+' para deixar '+x.n+'.');
(g.pend=g.pend||[]).push({k,j,d:{...d},role:a.role,sal:a.sal,yrs:a.yrs});
g.news.unshift(d.n+' assinou pré-contrato: chega quando o contrato com '+x.n+' acabar (fim da temporada).');
toast(d.n+' aceitou! Chega ao fim da temporada, quando o contrato com '+x.n+' acabar.',1);save();draw()})}
function vMkt(){const g=S.g,t=g.team;
const my=(i,d)=>d?`<tr><td>${['1º','2º','Reserva'][i]}</td><td>${flag(d.c)} ${pl(d)}</td><td>${nf(d.r)}</td><td>${D(d.sal||0)}</td><td>${d.yrs||'-'} ano(s)${d.nx?' → '+d.nx.yrs+'a':''}${d.off?' ⚠️ '+d.off:''}</td><td><button onclick="renew(${i})">Renovar</button>${i==2?` <button onclick="promote(0)">Promover ao 1º</button> <button onclick="promote(1)">Promover ao 2º</button>`:''}</td></tr>`:'';
const H='<tr><th></th><th>Piloto</th><th>Idade</th><th>Equipe</th><th>Função</th><th>Nota</th><th>Pot.</th><th>Contrato</th><th></th></tr>';
const fa=g.pool.map((d,i)=>`<tr><td>${flag(d.c)}</td><td>${pl(d)}</td><td>${d.a||d.age||'-'}</td><td>—</td><td>Sem contrato</td><td>${nf(d.r)}</td><td>${nf(d.pot||d.r)}</td><td>livre</td><td><button onclick="propose(${i})">Contratar</button></td></tr>`).join('');
const ot=g.grid.map((x,k)=>k==g.ti?'':[...x.d.map((d,j)=>[d,j]),...(x.t?[[x.t,'t']]:[])].map(([d,j])=>`<tr style='background:${x.bg}22'><td>${flag(d.c)}</td><td>${pl(d)}</td><td>${d.a||d.age||'-'}</td><td style='background:${x.bg};color:${x.fg}'>${x.n}</td><td>${j=='t'?'Reserva':(j+1)+'º piloto'}</td><td>${nf(d.r)}</td><td>${nf(d.pot||d.r)}</td><td>${d.yrs||1} ano(s)</td><td><button onclick="poach(${k},'${j}')">Negociar</button></td></tr>`).join('')).join('');
return `<div class='bx'><h4>Meus pilotos</h4><div class='in wrap'><table class='t'><tr><th>Função</th><th>Piloto</th><th>Nota</th><th>Salário/temp.</th><th>Contrato</th><th></th></tr>${my(0,t.d[0])}${my(1,t.d[1])}${my(2,t.t)}</table><p class='mu'>O reserva pode ser promovido a titular (o titular vai para a reserva).</p></div></div><div class='bx'><h4>Pilotos sem contrato</h4><div class='in wrap'><table class='t'>${H}${fa}</table></div></div><div class='bx'><h4>Pilotos de outras equipes (titulares e reservas)</h4><div class='in wrap'><table class='t'>${H}${ot}</table><p class='mu'>Quem tem contrato só chega quando ele acaba. Equipes do jogo também trocam pilotos entre si no fim da temporada.</p></div></div><button onclick="S.tab='dash';go('manage')">Voltar</button>`}
function initG(g,o){const m=TST[o.n];let p=m?{n:m[0],c:m[1],r:m[2],age:26,pot:m[2]}:null;if(p)g.pool=g.pool.filter(x=>x.n!=p.n);else p=g.pool.shift();if(p)g.team.t=cl(p);
g.grid.forEach((x,k)=>{if(k==g.ti||x.t)return;const q=TST[x.n];if(q){g.pool=g.pool.filter(z=>z.n!=q[0]);x.t=cl({n:q[0],c:q[1],r:q[2],age:26,pot:q[2]})}});ensureInv(g)}
function contracts(g){const t=g.team;
[0,1,'t'].forEach(k=>{const d=k=='t'?t.t:t.d[k];if(!d)return;const ret=(d.a||d.age||28)>=d.ap;
if(!ret&&d.nx){d.sal=d.nx.sal;d.yrs=d.nx.yrs;delete d.nx;delete d.off;return}
if(!ret&&d.yrs>1){d.yrs--;return}
const k2=!ret&&d.off?g.grid.findIndex(x=>x.n==d.off):-1;
if(k2>=0&&k2!=g.ti){const x=g.grid[k2],j=Math.floor(rnd(0,2)),o=x.d[j];x.d[j]={...d,yrs:2};delete x.d[j].off;if(o)g.pool.push(o);g.news.unshift(d.n+' deixou sua equipe e assinou com '+x.n+'.')}
else{g.pool.push(d);g.news.unshift(d.n+(ret?' se aposentou.':' saiu: contrato encerrado.'))}
if(k=='t')t.t=null;else t.d[k]=repl(g,t)||d});
if(!t.t)t.t=best2(g);
(g.pend||[]).forEach(p=>{const x=g.grid[p.k],s=p.j=='t'?x.t:x.d[p.j];if(!s||s.n!=p.d.n)return;
if(p.j=='t')x.t=null;else x.d[p.j]=repl(g,x)||s;
const nd={...s,sal:p.sal,yrs:p.yrs};let old;if(p.role=='t'){old=t.t;t.t=nd}else{old=t.d[+p.role];t.d[+p.role]=nd}
if(old)g.pool.push(old);g.news.unshift(s.n+' chegou à sua equipe.')});
g.grid.forEach((x,k)=>{if(k==g.ti)return;x.d.forEach((d,j)=>{if(d.yrs>1){d.yrs--;return}
if((d.a||d.age||28)>=d.ap){const r=repl(g,x);if(r){x.d[j]=r;g.news.unshift(d.n+' se aposentou.');return}}
if(Math.random()<.3){const k2=Math.floor(rnd(0,g.grid.length));if(k2!=k&&k2!=g.ti){const y=g.grid[k2],j2=Math.floor(rnd(0,2)),e=y.d[j2];if(e){x.d[j]=e;y.d[j2]=d;d.yrs=Math.ceil(rnd(1.5,4));e.yrs=Math.ceil(rnd(1.5,4));g.news.unshift(d.n+' foi para '+y.n+' e '+e.n+' foi para '+x.n+'.');return}}}
d.yrs=Math.ceil(rnd(1,4))})});
g.pend=[];[...g.grid.flatMap(x=>x.d),...g.grid.map(x=>x.t),t.t,...g.pool].forEach(d=>{if(d){if(d.a)d.a++;else if(d.age)d.age++}})}

draw();
